name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS build and tests
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Compile release application
        run: swift build --configuration release --force-resolved-versions -Xswiftc -DPEACHY_APP_BUNDLE
      - name: Run repository tests
        run: swift test --force-resolved-versions
      - name: Print native test crash reports
        if: failure()
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          reports = Path.home() / "Library/Logs/DiagnosticReports"
          matches = sorted({*reports.glob("*xctest*"), *reports.glob("*PeachyPet*")})
          for report in matches:
              if report.is_file():
                  print(f"=== {report.name} ===", flush=True)
                  print(report.read_text(errors="replace")[:100_000], flush=True)
          if not matches:
              print("No native test crash report was produced.")
          PYTHON
